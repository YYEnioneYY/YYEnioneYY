<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Danila Mission Control</title>
  <desc id="desc">Decorative animated mission control dashboard showing the technologies used by Danila.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091a"/>
      <stop offset=".5" stop-color="#0d1230"/>
      <stop offset="1" stop-color="#071422"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11183c" stop-opacity=".94"/>
      <stop offset="1" stop-color="#081321" stop-opacity=".92"/>
    </linearGradient>
    <radialGradient id="radarGlow">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#7c83fd" stop-opacity=".06"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#00f5d4" stop-opacity=".02"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="telemetry" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c83fd"/>
      <stop offset=".48" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#38f9d7"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7c83fd" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <clipPath id="radarClip">
      <circle cx="278" cy="272" r="158"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#background)"/>
  <rect x="1.5" y="1.5" width="1197" height="517" rx="24.5" fill="none" stroke="#7c83fd" stroke-opacity=".5" stroke-width="3"/>
  <rect x="18" y="18" width="1164" height="484" rx="18" fill="url(#grid)"/>

  <g fill="#d9e7ff" font-family="'Segoe UI',Arial,sans-serif">
    <text x="56" y="68" font-size="28" font-weight="800" letter-spacing="6">MISSION CONTROL</text>
    <text x="56" y="94" fill="#7c83fd" font-size="11" font-weight="700" letter-spacing="3">DANILA // FULL STACK OPERATIONS DECK</text>
    <text x="1144" y="65" fill="#90a1c7" font-size="11" text-anchor="end" letter-spacing="2">DECORATIVE TELEMETRY</text>
  </g>

  <g aria-label="Animated satellite">
    <animateTransform attributeName="transform" type="translate" values="-150 0;1300 0" dur="13s" repeatCount="indefinite"/>
    <g transform="translate(0 42)">
      <path d="M-3 0h24M9-12V12" stroke="#b7c4ff" stroke-width="2"/>
      <rect x="-11" y="-8" width="20" height="16" rx="3" fill="#7c83fd" stroke="#d9e7ff"/>
      <path d="M-17-11h-22v22h22M15-11h22v22H15" fill="#17335d" stroke="#00e5ff"/>
      <path d="M-39 0h22M15 0h22M-28-11v22M26-11v22" stroke="#00e5ff" stroke-opacity=".58"/>
      <circle cx="-1" cy="0" r="3" fill="#00f5d4" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g aria-label="Radar">
    <rect x="56" y="112" width="445" height="340" rx="18" fill="url(#panel)" stroke="#253461" stroke-width="2"/>
    <circle cx="278" cy="272" r="188" fill="url(#radarGlow)" filter="url(#softGlow)"/>
    <circle cx="278" cy="272" r="158" fill="#061423" fill-opacity=".92" stroke="#00e5ff" stroke-opacity=".46" stroke-width="2"/>
    <g fill="none" stroke="#00e5ff" stroke-opacity=".24">
      <circle cx="278" cy="272" r="118"/>
      <circle cx="278" cy="272" r="78"/>
      <circle cx="278" cy="272" r="39"/>
      <path d="M120 272h316M278 114v316"/>
      <path d="M166 160l224 224M390 160L166 384"/>
    </g>
    <g clip-path="url(#radarClip)">
      <g transform="rotate(0 278 272)">
        <path d="M278 272L278 114A158 158 0 0 1 405 178Z" fill="url(#sweep)"/>
        <path d="M278 272L405 178" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 278 272" to="360 278 272" dur="4.8s" repeatCount="indefinite"/>
      </g>
    </g>
    <g fill="#00f5d4" filter="url(#glow)">
      <circle cx="205" cy="214" r="4">
        <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="325" r="4">
        <animate attributeName="r" values="3;6;3" dur="2.4s" begin=".7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin=".7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="373" cy="208" r="4">
        <animate attributeName="r" values="3;7;3" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="238" cy="358" r="4">
        <animate attributeName="r" values="3;6;3" dur="2.2s" begin=".25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".3;1;.3" dur="2.2s" begin=".25s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="278" cy="272" r="6" fill="#fff" filter="url(#glow)"/>
    <text x="278" y="435" fill="#7890b8" font-family="'Segoe UI',Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">RADAR ARRAY // SECTOR 07</text>
  </g>

  <g aria-label="Technology service statuses" font-family="'Segoe UI',Arial,sans-serif">
    <rect x="526" y="112" width="618" height="340" rx="18" fill="url(#panel)" stroke="#253461" stroke-width="2"/>
    <text x="558" y="150" fill="#90a1c7" font-size="11" font-weight="700" letter-spacing="3">SERVICE MATRIX</text>
    <path d="M558 165h554" stroke="#253461"/>

    <g transform="translate(558 194)">
      <circle cx="8" cy="0" r="6" fill="#00f5a0" filter="url(#glow)">
        <animate attributeName="opacity" values=".4;1;.4" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="5" fill="#d9e7ff" font-size="16" font-weight="650">API Gateway</text>
      <text x="528" y="5" fill="#00f5a0" font-size="13" font-weight="800" text-anchor="end" letter-spacing="2">ONLINE</text>
    </g>
    <path d="M558 216h554" stroke="#1c294d"/>

    <g transform="translate(558 240)">
      <circle cx="8" cy="0" r="6" fill="#00f5a0" filter="url(#glow)">
        <animate attributeName="opacity" values=".45;1;.45" dur="1.65s" begin=".2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="5" fill="#d9e7ff" font-size="16" font-weight="650">Auth Service</text>
      <text x="528" y="5" fill="#00f5a0" font-size="13" font-weight="800" text-anchor="end" letter-spacing="2">ONLINE</text>
    </g>
    <path d="M558 262h554" stroke="#1c294d"/>

    <g transform="translate(558 286)">
      <circle cx="8" cy="0" r="6" fill="#00e5ff" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="1.9s" begin=".45s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="5" fill="#d9e7ff" font-size="16" font-weight="650">Kafka Cluster</text>
      <text x="528" y="5" fill="#00e5ff" font-size="13" font-weight="800" text-anchor="end" letter-spacing="2">CONNECTED</text>
    </g>
    <path d="M558 308h554" stroke="#1c294d"/>

    <g transform="translate(558 332)">
      <circle cx="8" cy="0" r="6" fill="#7c83fd" filter="url(#glow)">
        <animate attributeName="opacity" values=".4;1;.4" dur="1.55s" begin=".8s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="5" fill="#d9e7ff" font-size="16" font-weight="650">PostgreSQL</text>
      <text x="528" y="5" fill="#a8adff" font-size="13" font-weight="800" text-anchor="end" letter-spacing="2">HEALTHY</text>
    </g>
    <path d="M558 354h554" stroke="#1c294d"/>

    <g transform="translate(558 378)">
      <circle cx="8" cy="0" r="6" fill="#00e5ff" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.05s" begin=".35s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="5" fill="#d9e7ff" font-size="16" font-weight="650">React Interface</text>
      <text x="528" y="5" fill="#00e5ff" font-size="13" font-weight="800" text-anchor="end" letter-spacing="2">SYNCED</text>
    </g>

    <rect x="558" y="407" width="554" height="28" rx="8" fill="#09292c" stroke="#00f5a0" stroke-opacity=".45"/>
    <circle cx="577" cy="421" r="5" fill="#00f5a0" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="593" y="425" fill="#00f5a0" font-size="12" font-weight="800" letter-spacing="3">SYSTEMS OPERATIONAL</text>
    <text x="1096" y="425" fill="#6ea5a7" font-size="9" text-anchor="end" letter-spacing="1">SIMULATION MODE</text>
  </g>

  <g aria-label="Animated telemetry line">
    <text x="56" y="482" fill="#7084ad" font-family="'Segoe UI',Arial,sans-serif" font-size="10" letter-spacing="2">TELEMETRY</text>
    <path d="M153 479H230l12-11 14 22 16-16 13 5h54l10-9 15 18 12-9h76l12-14 13 24 18-17 11 7h70l11-9 16 19 15-10h74l14-13 14 23 18-18 12 8h92l10-11 16 21 14-11h99"
          fill="none" stroke="#172444" stroke-width="6" stroke-linecap="round"/>
    <path d="M153 479H230l12-11 14 22 16-16 13 5h54l10-9 15 18 12-9h76l12-14 13 24 18-17 11 7h70l11-9 16 19 15-10h74l14-13 14 23 18-18 12 8h92l10-11 16 21 14-11h99"
          fill="none" stroke="url(#telemetry)" stroke-width="2.4" stroke-linecap="round"
          stroke-dasharray="100 820" stroke-dashoffset="0" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="100" to="-820" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
