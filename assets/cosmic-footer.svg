<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" role="img" aria-labelledby="title description">
  <title id="title">Thanks for visiting</title>
  <desc id="description">Animated cosmic footer with stars and a glowing horizon.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117" />
      <stop offset="1" stop-color="#020024" />
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#00D9FF" />
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="160" fill="url(#background)" />

  <g fill="#FFFFFF">
    <circle cx="80" cy="35" r="1.3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="205" cy="92" r="1">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="28" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="485" cy="118" r="1">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="710" cy="25" r="1.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="845" cy="110" r="1.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="4.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1010" cy="42" r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1130" cy="97" r="1.4">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <path d="M0 142 C235 98 390 165 600 124 C810 83 995 158 1200 112 V160 H0 Z" fill="#11104A" opacity="0.45" />
  <path d="M0 143 C235 99 390 166 600 125 C810 84 995 159 1200 113" fill="none" stroke="url(#horizon)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
  </path>

  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="66" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="4">THANKS FOR VISITING</text>
    <text x="600" y="94" fill="#A5F3FC" font-size="12" letter-spacing="3">TRANSMISSION COMPLETE • SEE YOU AMONG THE STARS</text>
  </g>
</svg>
