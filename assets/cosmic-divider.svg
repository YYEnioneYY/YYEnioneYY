<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 46" role="img" aria-label="Animated cosmic divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0" />
      <stop offset="0.28" stop-color="#6C63FF" stop-opacity="0.8" />
      <stop offset="0.5" stop-color="#00D9FF" />
      <stop offset="0.72" stop-color="#6C63FF" stop-opacity="0.8" />
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <line x1="110" y1="23" x2="1090" y2="23" stroke="url(#line)" stroke-width="1.5" />

  <g filter="url(#glow)">
    <circle cx="110" cy="23" r="3" fill="#FFFFFF" />
    <path d="M78 23 H106" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <animateTransform attributeName="transform" type="translate" values="0 0;980 0" dur="5.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="5.5s" repeatCount="indefinite" />
  </g>

  <circle cx="600" cy="23" r="4" fill="#00D9FF" filter="url(#glow)">
    <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite" />
  </circle>
</svg>
