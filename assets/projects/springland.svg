<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Springland project</title>
  <desc id="desc">Animated green planet representing the private Springland mobile application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a20"/><stop offset="1" stop-color="#0b241d"/></linearGradient>
    <radialGradient id="planet" cx=".3" cy=".25"><stop stop-color="#c8ffd8"/><stop offset=".42" stop-color="#39c77d"/><stop offset="1" stop-color="#0d633f"/></radialGradient>
    <linearGradient id="ring"><stop stop-color="#00e5ff" stop-opacity=".1"/><stop offset=".46" stop-color="#57f287"/><stop offset="1" stop-color="#00f5d4" stop-opacity=".1"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <clipPath id="planetClip"><circle cx="154" cy="151" r="67"/></clipPath>
  </defs>
  <rect width="560" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="557" height="297" rx="20.5" fill="none" stroke="#39c77d" stroke-opacity=".56" stroke-width="3"/>
  <g fill="#fff">
    <circle cx="46" cy="42" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="249" cy="39" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="512" cy="48" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="469" cy="263" r="1.5"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="257" cy="274" r="1.2"><animate attributeName="opacity" values="1;.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="154" cy="153" r="87" fill="#28c779" opacity=".18" filter="url(#shadow)"/>
  <ellipse cx="154" cy="151" rx="111" ry="32" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(-9 154 151)" stroke-dasharray="14 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-46" dur="5.6s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="154" cy="151" r="67" fill="url(#planet)" stroke="#bfffd3" stroke-opacity=".42"/>
  <g clip-path="url(#planetClip)" fill="none" stroke="#ddffe8" stroke-opacity=".2">
    <path d="M80 126c46-22 100-14 151 8M82 170c44 18 99 21 149-6" stroke-width="9"/>
    <path d="M118 84c-7 50 3 95 33 136M171 84c23 39 24 84 9 129" stroke-width="5"/>
  </g>
  <g transform="rotate(0 154 151)">
    <circle cx="254" cy="151" r="8" fill="#c8ffd8" filter="url(#glow)"/>
    <circle cx="254" cy="151" r="3" fill="#179b62"/>
    <animateTransform attributeName="transform" type="rotate" from="0 154 151" to="360 154 151" dur="8s" repeatCount="indefinite"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="286" y="68" fill="#57f287" font-size="10" font-weight="800" letter-spacing="3">MOBILE EXPEDITION</text>
    <text x="286" y="105" fill="#f0fff5" font-size="29" font-weight="800">Springland</text>
    <text x="286" y="132" fill="#aab8d8" font-size="13">Warehouse scanning workflow</text>
    <rect x="286" y="158" width="82" height="25" rx="12" fill="#12382d" stroke="#299b65"/><text x="327" y="175" fill="#c8ffda" font-size="10" font-weight="700" text-anchor="middle">ANDROID</text>
    <rect x="376" y="158" width="72" height="25" rx="12" fill="#12382d" stroke="#299b65"/><text x="412" y="175" fill="#c8ffda" font-size="10" font-weight="700" text-anchor="middle">KOTLIN</text>
    <rect x="456" y="158" width="68" height="25" rx="12" fill="#12382d" stroke="#299b65"/><text x="490" y="175" fill="#c8ffda" font-size="10" font-weight="700" text-anchor="middle">QR / DM</text>
    <text x="286" y="224" fill="#7f90b4" font-size="11" letter-spacing="1.5">PRIVATE MISSION</text>
    <circle cx="291" cy="252" r="5" fill="#ffcc66" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="307" y="256" fill="#ffcc66" font-size="11" font-weight="800" letter-spacing="2">SOURCE CLASSIFIED</text>
  </g>
</svg>
