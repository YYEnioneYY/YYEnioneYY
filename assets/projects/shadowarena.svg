<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">ShadowArena frontend project</title>
  <desc id="desc">Animated red and magenta arena planet representing the ShadowArena frontend project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#160b1c"/>
      <stop offset="1" stop-color="#25101a"/>
    </linearGradient>
    <radialGradient id="planet" cx=".32" cy=".27">
      <stop stop-color="#ffd0e2"/>
      <stop offset=".38" stop-color="#e54880"/>
      <stop offset=".72" stop-color="#7c2d83"/>
      <stop offset="1" stop-color="#321340"/>
    </radialGradient>
    <linearGradient id="ring">
      <stop stop-color="#ff6b81" stop-opacity=".12"/>
      <stop offset=".48" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#b45cff" stop-opacity=".14"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="planetClip"><circle cx="154" cy="151" r="67"/></clipPath>
  </defs>

  <rect width="560" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="557" height="297" rx="20.5" fill="none" stroke="#c44b7b" stroke-opacity=".62" stroke-width="3"/>

  <g fill="#fff">
    <circle cx="41" cy="56" r="1.5"><animate attributeName="opacity" values=".18;1;.18" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="246" cy="34" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="519" cy="65" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="472" cy="264" r="1.2"><animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="272" r="1.4"><animate attributeName="opacity" values="1;.15;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="154" cy="153" r="87" fill="#dc376f" opacity=".18" filter="url(#shadow)"/>
  <ellipse cx="154" cy="151" rx="112" ry="33" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(10 154 151)" stroke-dasharray="5 10">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="4.8s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="154" cy="151" r="67" fill="url(#planet)" stroke="#ffd0e2" stroke-opacity=".42"/>

  <g clip-path="url(#planetClip)" fill="none">
    <ellipse cx="154" cy="156" rx="60" ry="25" stroke="#ffd6e4" stroke-opacity=".23" stroke-width="8"/>
    <ellipse cx="154" cy="156" rx="42" ry="17" stroke="#260f38" stroke-opacity=".46" stroke-width="7"/>
    <path d="M94 126c44-20 88-19 122 1" stroke="#ffe2ec" stroke-opacity=".15" stroke-width="6"/>
  </g>

  <g aria-label="Arena emblem" transform="translate(154 151)" filter="url(#glow)">
    <g>
      <path d="M0-28L8-9 28 0 8 9 0 28-8 9-28 0-8-9Z" fill="#210d31" stroke="#ffd6e4" stroke-opacity=".8"/>
      <circle r="7" fill="#ff4d8d"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="rotate(0 154 151)">
    <circle cx="255" cy="151" r="7" fill="#ff5c8c" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" from="0 154 151" to="-360 154 151" dur="7.8s" repeatCount="indefinite"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="286" y="68" fill="#ff6f9c" font-size="10" font-weight="800" letter-spacing="3">GAME FRONTEND</text>
    <text x="286" y="105" fill="#fff2f7" font-size="27" font-weight="800">ShadowArena</text>
    <text x="286" y="132" fill="#aab8d8" font-size="13">Interactive arena interface</text>

    <rect x="286" y="158" width="58" height="25" rx="12" fill="#321525" stroke="#a73d67"/>
    <text x="315" y="175" fill="#ffd1e0" font-size="10" font-weight="700" text-anchor="middle">REACT</text>
    <rect x="352" y="158" width="82" height="25" rx="12" fill="#321525" stroke="#a73d67"/>
    <text x="393" y="175" fill="#ffd1e0" font-size="10" font-weight="700" text-anchor="middle">TYPESCRIPT</text>
    <rect x="442" y="158" width="82" height="25" rx="12" fill="#321525" stroke="#a73d67"/>
    <text x="483" y="175" fill="#ffd1e0" font-size="10" font-weight="700" text-anchor="middle">TAILWIND</text>

    <text x="286" y="224" fill="#7f90b4" font-size="11" letter-spacing="1.5">FRONTEND PROJECT</text>
    <circle cx="291" cy="252" r="5" fill="#ff5c8c" filter="url(#glow)">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.35s" repeatCount="indefinite"/>
    </circle>
    <text x="307" y="256" fill="#ff729f" font-size="11" font-weight="800" letter-spacing="2">EXPLORE MISSION</text>
  </g>
</svg>
