<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Request App project</title>
  <desc id="desc">Animated blue planet representing Request App.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081527"/><stop offset="1" stop-color="#071b2f"/></linearGradient>
    <radialGradient id="planet" cx=".3" cy=".25"><stop stop-color="#a9f2ff"/><stop offset=".4" stop-color="#2a9df4"/><stop offset="1" stop-color="#07508c"/></radialGradient>
    <linearGradient id="ring"><stop stop-color="#7c83fd" stop-opacity=".1"/><stop offset=".48" stop-color="#00e5ff"/><stop offset="1" stop-color="#00f5d4" stop-opacity=".12"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <clipPath id="planetClip"><circle cx="154" cy="151" r="66"/></clipPath>
  </defs>
  <rect width="560" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="557" height="297" rx="20.5" fill="none" stroke="#00b8e6" stroke-opacity=".62" stroke-width="3"/>
  <g fill="#fff">
    <circle cx="39" cy="57" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="243" cy="32" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="519" cy="63" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="476" cy="264" r="1.5"><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="271" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="154" cy="153" r="86" fill="#00b8e6" opacity=".2" filter="url(#shadow)"/>
  <ellipse cx="154" cy="151" rx="110" ry="31" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(14 154 151)" stroke-dasharray="12 7">
    <animate attributeName="stroke-dashoffset" from="0" to="38" dur="4.4s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="154" cy="151" r="66" fill="url(#planet)" stroke="#a9f2ff" stroke-opacity=".48"/>
  <g clip-path="url(#planetClip)" fill="none" stroke="#d7f8ff" stroke-opacity=".2">
    <path d="M79 124c42-19 97-17 151 8M80 169c49 20 96 21 150-2" stroke-width="8"/>
    <path d="M116 88c30 26 47 71 46 130M165 85c28 35 38 76 26 124" stroke-width="5"/>
  </g>
  <g transform="rotate(0 154 151)">
    <g transform="translate(250 151)" fill="#d8fbff" stroke="#00e5ff">
      <rect x="-8" y="-5" width="16" height="10" rx="2"/>
      <path d="M-10-7h-13v14h13M10-7h13v14H10" fill="#124c7b"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 154 151" to="-360 154 151" dur="7.2s" repeatCount="indefinite"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="286" y="68" fill="#4bdcff" font-size="10" font-weight="800" letter-spacing="3">ORBITAL APPLICATION</text>
    <text x="286" y="105" fill="#effcff" font-size="29" font-weight="800">Request App</text>
    <text x="286" y="132" fill="#aab8d8" font-size="13">Full-stack request workflow</text>
    <rect x="286" y="158" width="66" height="25" rx="12" fill="#0b314d" stroke="#168bd0"/><text x="319" y="175" fill="#a9efff" font-size="10" font-weight="700" text-anchor="middle">REACT</text>
    <rect x="360" y="158" width="72" height="25" rx="12" fill="#0b314d" stroke="#168bd0"/><text x="396" y="175" fill="#a9efff" font-size="10" font-weight="700" text-anchor="middle">NESTJS</text>
    <rect x="440" y="158" width="92" height="25" rx="12" fill="#0b314d" stroke="#168bd0"/><text x="486" y="175" fill="#a9efff" font-size="10" font-weight="700" text-anchor="middle">POSTGRES</text>
    <text x="286" y="224" fill="#7f90b4" font-size="11" letter-spacing="1.5">PUBLIC REPOSITORY</text>
    <circle cx="291" cy="252" r="5" fill="#00f5d4" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="307" y="256" fill="#00f5d4" font-size="11" font-weight="800" letter-spacing="2">OPEN ON GITHUB</text>
  </g>
</svg>
