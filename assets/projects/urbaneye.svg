<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">UrbanEye microservices project</title>
  <desc id="desc">Animated green city planet representing the UrbanEye smart-city microservice platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061a21"/>
      <stop offset="1" stop-color="#092a27"/>
    </linearGradient>
    <radialGradient id="planet" cx=".32" cy=".26">
      <stop stop-color="#d2ffe2"/>
      <stop offset=".4" stop-color="#40d58b"/>
      <stop offset=".76" stop-color="#168374"/>
      <stop offset="1" stop-color="#08444c"/>
    </radialGradient>
    <linearGradient id="ring">
      <stop stop-color="#00e5ff" stop-opacity=".1"/>
      <stop offset=".47" stop-color="#57f287"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity=".12"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="planetClip"><circle cx="154" cy="151" r="68"/></clipPath>
  </defs>

  <rect width="560" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="557" height="297" rx="20.5" fill="none" stroke="#3bd58b" stroke-opacity=".62" stroke-width="3"/>

  <g fill="#fff">
    <circle cx="45" cy="45" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="38" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="514" cy="51" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="264" r="1.5"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="258" cy="273" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="154" cy="153" r="88" fill="#2ad687" opacity=".2" filter="url(#shadow)"/>
  <ellipse cx="154" cy="151" rx="112" ry="33" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(-10 154 151)" stroke-dasharray="15 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-46" dur="5.1s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="154" cy="151" r="68" fill="url(#planet)" stroke="#c7ffdc" stroke-opacity=".46"/>

  <g clip-path="url(#planetClip)">
    <path d="M84 175h140v55H84Z" fill="#062b32" fill-opacity=".64"/>
    <path d="M91 173v-35h17v35M113 173v-52h21v52M140 173v-27h16v27M162 173v-64h22v64M190 173v-43h18v43" fill="#0c5555" stroke="#b4ffe0" stroke-opacity=".32"/>
    <g fill="#9bffcf">
      <rect x="118" y="130" width="4" height="5"/><rect x="126" y="130" width="4" height="5"/>
      <rect x="168" y="120" width="4" height="5"/><rect x="176" y="120" width="4" height="5"/>
      <rect x="168" y="132" width="4" height="5"/><rect x="176" y="132" width="4" height="5"/>
      <rect x="195" y="141" width="4" height="5"/>
    </g>
  </g>

  <g transform="rotate(0 154 151)">
    <g transform="translate(256 151)" filter="url(#glow)">
      <circle r="9" fill="#071f2c" stroke="#00e5ff"/>
      <circle r="3.5" fill="#00e5ff"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 154 151" to="360 154 151" dur="6.8s" repeatCount="indefinite"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="286" y="68" fill="#57f287" font-size="10" font-weight="800" letter-spacing="3">SMART CITY SYSTEM</text>
    <text x="286" y="105" fill="#f1fff6" font-size="29" font-weight="800">UrbanEye</text>
    <text x="286" y="132" fill="#aab8d8" font-size="13">Video &amp; camera microservices</text>

    <rect x="286" y="158" width="72" height="25" rx="12" fill="#12382d" stroke="#299b65"/>
    <text x="322" y="175" fill="#c8ffda" font-size="10" font-weight="700" text-anchor="middle">NESTJS</text>
    <rect x="366" y="158" width="66" height="25" rx="12" fill="#12382d" stroke="#299b65"/>
    <text x="399" y="175" fill="#c8ffda" font-size="10" font-weight="700" text-anchor="middle">KAFKA</text>
    <rect x="440" y="158" width="92" height="25" rx="12" fill="#12382d" stroke="#299b65"/>
    <text x="486" y="175" fill="#c8ffda" font-size="10" font-weight="700" text-anchor="middle">POSTGRES</text>

    <text x="286" y="224" fill="#7f90b4" font-size="11" letter-spacing="1.5">MICROSERVICE PROJECT</text>
    <circle cx="291" cy="252" r="5" fill="#57f287" filter="url(#glow)">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="307" y="256" fill="#57f287" font-size="11" font-weight="800" letter-spacing="2">EXPLORE MISSION</text>
  </g>
</svg>
