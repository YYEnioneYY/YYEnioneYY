<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">CampusForge project</title>
  <desc id="desc">Animated purple planet representing the CampusForge platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1027"/><stop offset="1" stop-color="#120b2d"/></linearGradient>
    <radialGradient id="planet" cx=".34" cy=".28"><stop stop-color="#c4a7ff"/><stop offset=".43" stop-color="#8155e7"/><stop offset="1" stop-color="#32136f"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff" stop-opacity=".1"/><stop offset=".45" stop-color="#c4a7ff"/><stop offset="1" stop-color="#7c83fd" stop-opacity=".14"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <clipPath id="planetClip"><circle cx="154" cy="151" r="69"/></clipPath>
  </defs>
  <rect width="560" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="557" height="297" rx="20.5" fill="none" stroke="#8c66ff" stroke-opacity=".62" stroke-width="3"/>
  <g fill="#fff">
    <circle cx="42" cy="48" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="39" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="514" cy="54" r="1.7"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="468" cy="259" r="1.3"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="271" cy="268" r="1.5"><animate attributeName="opacity" values="1;.15;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="154" cy="153" r="87" fill="#7045dc" opacity=".24" filter="url(#shadow)"/>
  <ellipse cx="154" cy="151" rx="112" ry="33" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(-14 154 151)" stroke-dasharray="16 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="154" cy="151" r="69" fill="url(#planet)" stroke="#c4a7ff" stroke-opacity=".48"/>
  <g clip-path="url(#planetClip)" fill="none" stroke="#d9cbff" stroke-opacity=".22">
    <path d="M77 132c45-20 93-19 156 7M83 168c47 22 100 21 150-3" stroke-width="9"/>
    <path d="M121 80c-17 48-14 98 9 143M172 77c28 42 32 91 13 139" stroke-width="5"/>
  </g>
  <g transform="rotate(0 154 151)">
    <circle cx="256" cy="151" r="7" fill="#00e5ff" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 154 151" to="360 154 151" dur="6.5s" repeatCount="indefinite"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="286" y="68" fill="#9f86ff" font-size="10" font-weight="800" letter-spacing="3">FLAGSHIP PLANET</text>
    <text x="286" y="105" fill="#f1efff" font-size="29" font-weight="800">CampusForge</text>
    <text x="286" y="132" fill="#aab8d8" font-size="13">Campus platform &amp; services</text>
    <rect x="286" y="158" width="72" height="25" rx="12" fill="#25194c" stroke="#8155e7"/><text x="322" y="175" fill="#c9b9ff" font-size="10" font-weight="700" text-anchor="middle">NESTJS</text>
    <rect x="366" y="158" width="66" height="25" rx="12" fill="#25194c" stroke="#8155e7"/><text x="399" y="175" fill="#c9b9ff" font-size="10" font-weight="700" text-anchor="middle">KAFKA</text>
    <rect x="440" y="158" width="92" height="25" rx="12" fill="#25194c" stroke="#8155e7"/><text x="486" y="175" fill="#c9b9ff" font-size="10" font-weight="700" text-anchor="middle">POSTGRES</text>
    <text x="286" y="224" fill="#7f90b4" font-size="11" letter-spacing="1.5">PROJECT REPOSITORY</text>
    <circle cx="291" cy="252" r="5" fill="#00f5a0" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="307" y="256" fill="#00f5a0" font-size="11" font-weight="800" letter-spacing="2">EXPLORE MISSION</text>
  </g>
</svg>
